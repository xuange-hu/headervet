name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (zero runtime dependencies)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
          # The zero-dependency claim is about what `pip install headervet`
          # pulls in. Proving it here is the difference between a claim and a test.
          python -c "import headervet, sys; print('third-party modules loaded:', [m for m in sys.modules if m in ('yaml','click','rich','mcp','requests')])"

      - name: Tests
        run: python -m pytest -q

      - name: CLI smoke
        run: |
          headervet --version
          headervet rules | head -3
          headervet demo | tail -3

      - name: Self-audit must be clean
        run: headervet scan . --fail-on high

      - name: MCP manifest check
        run: |
          python -m pip install ".[mcp]"
          python -c "
          from headervet.mcp_server import build_server, TOOLS
          import asyncio
          server = build_server()
          async def go():
              tools = await server.list_tools()
              assert {t.name for t in tools} == set(TOOLS), [t.name for t in tools]
              assert all(t.description for t in tools), [t.name for t in tools]
              print('mcp tools:', len(tools))
          asyncio.run(go())
          "

  badge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install with optional test deps
        run: python -m pip install -e ".[mcp]" pytest
      - name: README test-count badge vs pytest collection
        run: |
          # -o addopts= neutralises a project-level -q; with the -q below it would
          # become -qq and pytest drops the "N tests collected" summary line.
          actual=$(python -m pytest --collect-only -q -o addopts= 2>/dev/null | grep -oE "[0-9]+ tests? collected" | grep -oE "^[0-9]+" || true)
          claimed=$(grep -oE "tests-[0-9]+%20passing" README.md | grep -oE "[0-9]+" | head -1 || true)
          echo "collected=${actual:-NOTHING} claimed=${claimed:-NONE}"
          if [ -z "$actual" ]; then
            echo "::warning::pytest collected nothing - the badge check did not run"
          elif [ "$actual" != "$claimed" ]; then
            echo "::warning::README badge says $claimed but pytest collects $actual"
          fi

  fresh-clone:
    # Every other job installs the package first, which masks a src-layout
    # bootstrap regression. Install pytest and nothing else.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: pytest only, no package install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: A bare clone can run its own tests
        run: python -m pytest -q
      - name: And the CLI still works from src
        run: python -c "import sys; sys.path.insert(0, 'src'); import headervet.cli as c; print('cli ok')"
